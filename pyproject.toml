[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-pipeline"
version = "8.0.0"
description = "Auditable English-podcast to Chinese briefing, TTS and publishing pipeline"
readme = "README.md"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (guarded by
# tests/test_pipeline_structure.py::PackagingContractTests).
dependencies = [
    "httpx>=0.28.0",
    "tqdm>=4.66.0",
    "soundfile>=0.12.1",
]

[project.scripts]
podcast-process = "scripts.process:main"
podcast-catalog = "scripts.catalog:main"

[tool.setuptools]
packages = ["scripts", "scripts.pipeline"]

[tool.setuptools.package-data]
scripts = ["*.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".venv-alignment",
    "content",
    "site",
    "reports",
    "benchmarks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Entry scripts bootstrap sys.path before imports, and tests insert the
# repository root the same way; E402 is expected there by design.
"scripts/process.py" = ["E402"]
"scripts/tts.py" = ["E402"]
"scripts/html_gen.py" = ["E402", "E501"]
"scripts/diarize.py" = ["E402"]
"scripts/pipeline_map.py" = ["E402"]
"scripts/ai_review.py" = ["E402", "E501"]
"scripts/agent_pipeline.py" = ["E501"]
"scripts/prewrite_fact_checks.py" = ["E501"]
"scripts/asr_benchmark_runner.py" = ["E402"]
"scripts/asr_benchmark_workflow.py" = ["E402"]
"scripts/asr_runtime.py" = ["E402"]
"scripts/benchmark.py" = ["E402"]
"scripts/catalog.py" = ["E402"]
"scripts/claim_evidence.py" = ["E402"]
"scripts/content_map.py" = ["E402"]
"scripts/episode.py" = ["E402"]
"scripts/evidence.py" = ["E402"]
"scripts/prepare_ami_benchmark.py" = ["E402"]
"scripts/quality_report.py" = ["E402"]
"scripts/release.py" = ["E402"]
"tests/*.py" = ["E402"]
# Long prose literals: the review/edit task prompts and the HTML/CSS/SVG
# template (including unwrappable data: URIs) legitimately exceed 100
# columns inside string literals. Code in these files stays fully checked.

[tool.mypy]
python_version = "3.12"
files = ["scripts"]
ignore_missing_imports = true

# Strict pocket: shared infrastructure modules are fully typed. Migrate
# further modules from the global lenient baseline into this list over time
# (see docs/module-map.md maintenance rules).
[[tool.mypy.overrides]]
module = [
    "scripts.hashing",
    "scripts.atomic_io",
    "scripts.retry",
    "scripts.text_distance",
]
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
